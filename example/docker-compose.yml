
services:
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.19.0-debian}
    restart: unless-stopped
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "127.0.0.1:9180:9180/tcp"
      - "127.0.0.1:9080:9080/tcp"
      - "127.0.0.1:9091:9091/tcp"
      - "127.0.0.1:9443:9443/tcp"
      - "127.0.0.1:9092:9092/tcp"
    networks:
      - apisix

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "no"
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?Set ETCD_ROOT_PASSWORD}
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - apisix

  web1:
    image: nginx:1.19.0-alpine
    restart: unless-stopped
    volumes:
      - ./upstream/web1.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:9081:80/tcp"
    environment:
      NGINX_PORT: "80"
    networks:
      - apisix

  web2:
    image: nginx:1.19.0-alpine
    restart: unless-stopped
    volumes:
      - ./upstream/web2.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:9082:80/tcp"
    environment:
      NGINX_PORT: "80"
    networks:
      - apisix

  prometheus:
    image: prom/prometheus:v2.25.0
    restart: unless-stopped
    volumes:
      - ./prometheus_conf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - apisix

  grafana:
    image: grafana/grafana:7.3.7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana_conf/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_conf/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana_conf/config/grafana.ini:/etc/grafana/grafana.ini:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - apisix

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki_conf/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - apisix

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy_conf/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - apisix

networks:
  apisix:
    driver: bridge

volumes:
  etcd_data:
    driver: local
  loki_data:
    driver: local
  alloy_data:
    driver: local
